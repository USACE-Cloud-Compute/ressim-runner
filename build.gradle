plugins {
    id 'java-library'
}

//Dependency Management
repositories {
    mavenCentral()

    // cc-java-sdk comes from its GitHub release instead of a jar at /cloud-compute/jar:
    //   https://github.com/USACE-Cloud-Compute/cc-java-sdk/releases/tag/v1.1.2
    // The release has no pom, only the asset below, so a pattern-based ivy repository
    // turns the coordinates into that URL:
    //   v[revision]/[module]-[revision]-all.[ext] -> v1.1.2/cc-java-sdk-1.1.2-all.jar
    ivy {
        url = 'https://github.com/USACE-Cloud-Compute/cc-java-sdk/releases/download'
        patternLayout {
            artifact 'v[revision]/[module]-[revision]-all.[ext]'
        }
        metadataSources { artifact() }
        content {
            includeModule('usace.cc', 'cc-java-sdk')
        }
    }
}

configurations {
    linux_x64
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.12.4'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.12.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.4'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.12.4'
    implementation platform('com.amazonaws:aws-java-sdk-bom:1.11.1000')
    implementation 'com.amazonaws:aws-java-sdk-s3'

    // replaces: implementation fileTree(dir: "/cloud-compute/jar", include: '*.jar')
    implementation 'usace.cc:cc-java-sdk:1.1.2@jar'

    implementation fileTree(dir: "/HEC-ResSim-3.5.1.18-linuxbeta-linux-x86_64/jar", include: '*.jar')
    implementation fileTree(dir: "/HEC-ResSim-3.5.1.18-linuxbeta-linux-x86_64/jar/ext", include: '*.jar')
    implementation fileTree(dir: "/HEC-ResSim-3.5.1.18-linuxbeta-linux-x86_64/jar/sys", include: '*.jar')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    zip64 = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes "Main-Class": "usace.cc.plugin.ressimrunner.RessimRunner"
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

group 'mil.army.usace.hec'
version '0.0.1'
