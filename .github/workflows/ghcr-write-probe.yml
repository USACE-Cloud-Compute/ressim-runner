# Throwaway diagnostic: why does GHCR deny this workflow's push?
# Run it from Actions -> "ghcr write probe" -> Run workflow. ~40 seconds, no build.
# Delete this file once the push works.
name: ghcr write probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PKG: usace-cloud-compute/ressim-runner

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Who is running, and what scopes does the token actually carry?
        run: |
          set -uo pipefail
          echo "actor            = ${GITHUB_ACTOR}"
          echo "repository       = ${GITHUB_REPOSITORY}"
          echo "event            = ${GITHUB_EVENT_NAME}"

          echo
          echo "== 1. token scopes requested from the registry =="
          jwt="$(curl -sS -u "unused:${GITHUB_TOKEN}" \
                 "https://ghcr.io/token?service=ghcr.io&scope=repository:${PKG}:pull,push" \
                 | jq -r '.token // "NONE"')"
          if [[ "${jwt}" == "NONE" ]]; then
            echo "registry refused to mint a token for GITHUB_TOKEN at all"
          else
            # access[] shows the actions the registry is willing to grant.
            # A missing "push" here explains permission_denied: write_package.
            printf '%s' "${jwt}" | cut -d. -f2 | base64 -d 2>/dev/null \
              | jq -c '{access: .access, granted_to: .sub, issuer: .iss}'
          fi

          echo
          echo "== 2. does the package already exist? =="
          code="$(curl -sS -o "${RUNNER_TEMP}/tags.json" -w '%{http_code}' \
                  -u "unused:${GITHUB_TOKEN}" "https://ghcr.io/v2/${PKG}/tags/list")"
          echo "HTTP ${code}"
          head -c 400 "${RUNNER_TEMP}/tags.json"; echo
          echo "404/NAME_UNKNOWN -> no push has ever created this package, so this"
          echo "                   run is a package *creation*, which is its own check"

          echo
          echo "== 3. the real test: push a 1 KB image =="
          d="${RUNNER_TEMP}/probe"; mkdir -p "${d}"; cd "${d}"
          echo probe > marker
          printf 'FROM scratch\nCOPY marker /\n' > Dockerfile
          docker build -q -t "ghcr.io/${PKG}:push-probe" . | tail -n1
          if docker push "ghcr.io/${PKG}:push-probe" 2>&1 | tail -n 5; then
            echo "RESULT: GITHUB_TOKEN can push. The pipeline's failure is elsewhere."
          else
            echo "RESULT: GITHUB_TOKEN cannot push."
          fi

      - name: Same push with a PAT, if GHCR_PAT is defined
        if: ${{ secrets.GHCR_PAT != '' }}
        run: |
          set -uo pipefail
          d="${RUNNER_TEMP}/probe2"; mkdir -p "${d}"; cd "${d}"
          echo probe > marker
          printf 'FROM scratch\nCOPY marker /\n' > Dockerfile
          echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker build -q -t "ghcr.io/${PKG}:push-probe" . | tail -n1
          if docker push "ghcr.io/${PKG}:push-probe" 2>&1 | tail -n 5; then
            echo "RESULT: a PAT pushes while GITHUB_TOKEN does not -> the block is on"
            echo "        the workflow identity (SAML SSO enforcement, or org rules on"
            echo "        who may CREATE a package), not on the image or the Dockerfile."
          else
            echo "RESULT: even the PAT was denied -> the package namespace itself is"
            echo "        refusing writes for this publisher."
          fi
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USERNAME: ${{ github.actor }}
