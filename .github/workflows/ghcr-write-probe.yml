# Throwaway diagnostic: why does GHCR deny this workflow's push?
# Run from Actions -> "ghcr write probe" -> Run workflow. ~60 seconds, no build.
# Findings are written to the run summary page, not just the log.
# Delete this file once the real push works.
name: ghcr write probe

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PKG: usace-cloud-compute/ressim-runner
  IMAGE: ghcr.io/usace-cloud-compute/ressim-runner

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Every value the script needs is passed in explicitly. `set -u` plus a
      # variable the runner does not export (GITHUB_TOKEN is not in the
      # documented default environment list) is what killed the previous run:
      # bash aborted with exit 1 before printing anything.
      - name: Probe write access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # Deliberately no `set -e` and no `set -u`: a diagnostic that dies on
          # the first unexpected value tells you nothing.
          set +e
          work="${RUNNER_TEMP:-$(mktemp -d)}"
          mkdir -p "$work"
          tok="${GITHUB_TOKEN:-}"
          granted=""
          # The push below needs a credential in the Docker config. Doing it here
          # rather than with an action keeps the JWT request and the push on the
          # same identity, and lets a failed login be reported instead of
          # masquerading as a permission denial.
          if [ -n "$tok" ]; then
            if printf '%s' "$tok" | docker login ghcr.io -u "${ACTOR:-unused}" --password-stdin >/dev/null 2>&1; then
              echo "docker login (GITHUB_TOKEN): OK"
            else
              echo "docker login (GITHUB_TOKEN): FAILED -> a push error from here is authentication, not permission"
            fi
          else
            echo "no token in the environment: docker has no ghcr credential"
          fi
          {
            echo "### GHCR write probe"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| actor | \`${ACTOR:-unset}\` |"
            echo "| token present in env | $([ -n "$tok" ] && echo yes || echo **NO**) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== 1. access claims in the token ghcr mints for us ====="
          raw="$(curl -sS -m 20 -u "unused:${tok}" \
                 "https://ghcr.io/token?service=ghcr.io&scope=repository:${PKG}:pull,push" 2>&1)"
          echo "curl exit=$?"
          jwt="$(printf '%s' "$raw" | jq -r '.token // "NONE"' 2>/dev/null)"
          if [ -z "$jwt" ] || [ "$jwt" = "NONE" ]; then
            echo "no JWT returned; registry reply (truncated, no token):"
            printf '%s' "$raw" | head -c 200; echo
            claims="(none)"
          else
            # Only the claims are printed, never the token itself. GitHub's JWT
            # payload is unpadded base64; GNU base64 -d tolerates that.
            claims="$(printf '%s' "$jwt" | cut -d. -f2 | base64 -d 2>/dev/null \
                      | jq -c '{access: .access, sub: .sub, iss: .iss}' 2>/dev/null)"
            echo "claims: ${claims:-unparseable}"
            if [ -z "${claims:-}" ]; then
              granted="could not read claims"
            elif ! printf '%s' "$claims" | grep -q '"push"'; then
              echo "NOTE: the registry granted pull only -- no push action in this token"
              granted="pull only (no push)"
            else
              granted="includes push"
            fi
          fi
          echo "| ghcr token grants | \`${granted:-nothing}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "===== 2. has the package ever been created? ====="
          code="$(curl -sS -m 20 -o "$work/tags.json" -w '%{http_code}' \
                  -u "unused:${tok}" "https://ghcr.io/v2/${PKG}/tags/list" 2>/dev/null)"
          # Never echo a raw reply into the summary: keep only a numeric status.
          case "${code}" in ''|*[!0-9]*) code="(non-numeric reply)" ;; esac
          echo "HTTP $code"
          head -c 300 "$work/tags.json" 2>/dev/null; echo
          echo "NAME_UNKNOWN here = no push has ever landed, so the failing push is a"
          echo "package *creation*, which GitHub authorizes separately from a write."
          echo "| tags/list | HTTP \`$code\` |" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "===== 3. the real test: push a 1 KB image ====="
          d="$work/probe"; mkdir -p "$d"; cd "$d" || exit 0
          echo probe > marker
          printf 'FROM scratch\nCOPY marker /\n' > Dockerfile
          docker build -q -t "${IMAGE}:push-probe" . 2>&1 | tail -n 3
          echo "build exit=${PIPESTATUS[0]}"
          pushout="$(docker push "${IMAGE}:push-probe" 2>&1)"
          pushrc=$?
          printf '%s\n' "$pushout" | tail -n 6
          echo "push exit=$pushrc"
          if [ "$pushrc" -eq 0 ]; then
            verdict="GITHUB_TOKEN **can** push: the release-run failure is actor- or trigger-specific"
          elif printf '%s' "$pushout" | grep -q "denied: permission_denied"; then
            verdict="GITHUB_TOKEN denied with \`write_package\` -- same as the release run"
          elif printf '%s' "$pushout" | grep -qi "authentication required\|unauthorized"; then
            verdict="no usable credential reached Docker (login problem, not permission)"
          else
            verdict="push failed for another reason: $(printf '%s' "$pushout" | tail -n 1)"
          fi
          echo "VERDICT: $verdict"
          echo "| push of a 1 KB image | $verdict |" >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "===== 4. is this package visible anonymously? ====="
          anon="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
                  "https://ghcr.io/v2/${PKG}/tags/list" 2>/dev/null)"
          case "${anon}" in ''|*[!0-9]*) anon="(non-numeric reply)" ;; esac
          echo "anonymous tags/list HTTP $anon (401/404 expected until it is public)"
          echo "| anonymous read | HTTP \`$anon\` |" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${GHCR_PAT:-}" ]; then
            echo
            echo "===== 5. same push with the PAT secret ====="
            printf '%s' "${GHCR_PAT}" | docker login ghcr.io -u "${ACTOR}" --password-stdin >/dev/null 2>&1
            patout="$(docker push "${IMAGE}:push-probe" 2>&1)"; patrc=$?
            printf '%s\n' "$patout" | tail -n 4
            if [ $patrc -eq 0 ]; then
              patv="PAT **can** push while the workflow token cannot -> SSO enforcement or a"
              patv="$patv package-creation rule on the workflow identity"
            else
              patv="PAT denied too -> the namespace refuses this publisher outright"
            fi
            echo "VERDICT: $patv"
            echo "| PAT push | $patv |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "===== 5. PAT comparison skipped (no GHCR_PAT secret) ====="
          fi
          exit 0
        continue-on-error: true

      # Only reached if the secret exists; keeps the run green when it does not.
      - name: PAT comparison
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ACTOR: ${{ github.actor }}
        run: |
          set +e
          [ -n "${GHCR_PAT:-}" ] || { echo "Add a GHCR_PAT repository secret (write:packages,"
            echo "SSO-authorized if the org enforces SAML) to get the token-vs-PAT split."; exit 0; }
          work="${RUNNER_TEMP:-$(mktemp -d)}"; d="$work/pat"; mkdir -p "$d"; cd "$d" || exit 0
          echo probe > marker
          printf 'FROM scratch\nCOPY marker /\n' > Dockerfile
          printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1
          docker build -q -t "${IMAGE}:push-probe" . >/dev/null 2>&1
          out="$(docker push "${IMAGE}:push-probe" 2>&1)"; rc=$?
          printf '%s\n' "$out" | tail -n 4
          [ $rc -eq 0 ] && echo "PAT push OK" || echo "PAT push failed"
          exit 0