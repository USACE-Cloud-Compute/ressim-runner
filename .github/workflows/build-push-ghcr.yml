# Builds Dockerfile.prod and pushes it to GHCR when a release is published.
#
# Tags published for release v3.5.1.18:  3.5.1.18, latest, <40-char commit>
# linux/amd64 only: the ResSim artifact is linux-x86_64 and build.gradle resolves
# its classes from /HEC-ResSim-<that name>/jar.
name: Build & Publish (Dockerfile.prod to GHCR)

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  # Lowercase, unlike the org login -- ghcr.io rejects uppercase image names.
  IMAGE: ghcr.io/usace-cloud-compute/ressim-runner
  DOCKERFILE: Dockerfile.prod

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            echo "primary=${IMAGE}:${version}"
            echo "tags<<TAGS"
            printf '%s\n%s\n%s\n' "${IMAGE}:${version}" "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"
            echo TAGS
          } >> "$GITHUB_OUTPUT"
          echo "tags for ${GITHUB_REF_NAME}:"
          printf '  %s\n' "${IMAGE}:${version}" "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.DOCKERFILE }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          # A plain image manifest: buildx's default attestation makes the pushed
          # digest an attestation index, which older container stacks refuse.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HEC-ResSim Runner
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        env:
          IMAGE_REF: ${{ steps.tags.outputs.primary }}
        run: |
          set -euo pipefail
          # `push: true` leaves nothing in the local daemon, so pull the tag back:
          # this checks what the registry is serving, not the build cache.
          docker pull --quiet "${IMAGE_REF}"
          docker run --rm --entrypoint sh -e LAUNCHER=/app/ressim-runner.sh "${IMAGE_REF}" -lc '
            set -eu
            command -v java >/dev/null 2>&1 || { echo "FAIL: no java on PATH"; exit 1; }
            java -version 2>&1 | head -n 1
            test -x "${LAUNCHER}" || { echo "FAIL: ${LAUNCHER} missing or not executable"; exit 1; }
            # The launcher names its jar literally (-jar $RESSIM_RUNNER_HOME/NAME.jar)
            # while build.gradle sets that version independently. If they disagree
            # the image pushes green and every container dies at startup.
            want="$(grep -o "ressim-runner-[A-Za-z0-9._-]*\.jar" "${LAUNCHER}" | head -n1)"
            test -n "${want}" || { echo "FAIL: no ressim-runner-*.jar named in ${LAUNCHER}"; exit 1; }
            test -f "${RESSIM_RUNNER_HOME}/${want}" \
              || { echo "FAIL: ${RESSIM_RUNNER_HOME}/${want} absent"; ls -l "${RESSIM_RUNNER_HOME}"; exit 1; }
            test -d "${RESSIM_HOME}/jar" || { echo "FAIL: ${RESSIM_HOME}/jar missing"; exit 1; }
            test -d "${RESSIM_HOME}/config" || { echo "FAIL: ${RESSIM_HOME}/config missing"; exit 1; }
            echo "smoke test OK: ${want}"
          '
